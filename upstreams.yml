# 多元采集配置：Action 每天拉取 → 自动识别格式 → 归一化 → 去重 → sources/auto/<name>.txt
# format 留空或写 auto 即可，脚本会按内容自动判断：
#   payload:            -> Clash rule-provider
#   domain_suffix_set:  -> Egern 原生 YAML
#   DOMAIN-SUFFIX / HOST-SUFFIX 纯文本 -> Surge / Loon / Quantumult X
# 想指定就写 format: surge | clash | egern

